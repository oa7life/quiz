<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Community Pharmacy — 3-Phase MCQ Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#080c1a;--card:#0e1530;--text:#f0f4ff;--muted:#8899cc;
    --accent:#60a5fa;--green:#22c55e;--red:#ef4444;--border:#1e2d5a;--border2:#263870;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:radial-gradient(ellipse at 20% 20%,#0d1a4a 0%,#080c1a 60%);color:var(--text);min-height:100vh;padding:20px 16px 48px}

  #screen-quiz{max-width:900px;margin:0 auto}
  .quiz-topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:7px 13px;color:var(--muted);font-size:13px;font-weight:600}
  .pill span{color:var(--text)}

  .progress-bar-wrap{height:4px;background:var(--border);border-radius:99px;margin-bottom:18px;overflow:hidden}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,#38bdf8,#818cf8);border-radius:99px;transition:width .3s}

  .quiz-card{background:rgba(14,21,48,.95);border:1px solid var(--border);border-radius:22px;padding:26px 24px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
  .qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .qtag{font-size:12px;font-weight:700;border-radius:999px;padding:5px 13px;letter-spacing:.04em;background:rgba(255,255,255,.08);border:1px solid var(--border)}
  .qmode{font-size:12px;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:999px;padding:4px 11px}

  .question-text{font-size:clamp(15px,2.6vw,19px);font-weight:700;line-height:1.5;margin-bottom:20px;color:#e8eeff}
  .options{display:grid;gap:9px}
  .opt{width:100%;text-align:left;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);border-radius:13px;padding:13px 16px;font-size:14px;font-family:inherit;cursor:pointer;transition:border-color .15s,background .15s,transform .12s;display:flex;align-items:flex-start;gap:11px;line-height:1.45}
  .opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--accent);background:rgba(96,165,250,.07)}
  .opt-letter{min-width:24px;height:24px;border-radius:7px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0;margin-top:1px;transition:.15s}
  .opt.correct{background:rgba(34,197,94,.14);border-color:var(--green)}
  .opt.correct .opt-letter{background:rgba(34,197,94,.25);border-color:var(--green);color:#86efac}
  .opt.wrong{background:rgba(239,68,68,.12);border-color:var(--red)}
  .opt.wrong .opt-letter{background:rgba(239,68,68,.2);border-color:var(--red);color:#fca5a5}
  .opt:disabled{cursor:default}

  .explain{display:none;margin-top:14px;padding:14px 16px;border-radius:13px;background:rgba(6,16,40,.7);border:1px solid var(--border2);color:#c7d8ff;line-height:1.6;font-size:13.5px}
  .explain.show{display:block}
  .explain .correct-label{color:#86efac;font-weight:700;font-size:14px;display:block;margin-bottom:5px}

  .controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
  .btn{border:0;border-radius:11px;padding:10px 16px;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;transition:opacity .15s,transform .1s}
  .btn:hover{opacity:.88;transform:translateY(-1px)}.btn:active{transform:translateY(0)}.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
  .btn.primary{background:linear-gradient(135deg,#2563eb,#4f46e5);color:white}
  .btn.secondary{background:#1e2d5a;color:#93c5fd}
  .btn.success{background:linear-gradient(135deg,#16a34a,#15803d);color:white}
  .btn.purple{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:white}
  .btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--muted)}

  .answer-list{display:none;margin-top:20px}.answer-list.show{display:block}
  .answer-list h3{font-size:15px;font-weight:700;margin-bottom:12px;color:#93c5fd}
  .answer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:9px}
  .answer-mini{background:rgba(14,21,48,.8);border:1px solid var(--border);border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.5}
  .answer-mini .q-num{color:#93c5fd;font-weight:700;font-size:11px;margin-bottom:3px}
  .answer-mini .q-ans{color:#86efac;font-weight:600}
  .footer-tip{margin-top:14px;color:var(--muted);font-size:12px;text-align:center}

  #screen-results{display:none;max-width:520px;margin:0 auto;text-align:center}
  .result-card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:40px 28px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
  .result-emoji{font-size:58px;margin-bottom:14px}
  .result-score{font-size:50px;font-weight:800;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .result-label{font-size:15px;color:var(--muted);margin-bottom:20px}
  .result-msg{font-size:19px;font-weight:700;margin-bottom:6px}
  .result-actions{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-top:26px}

  .header-inline{text-align:center;margin-bottom:20px}
  .header-inline .badge{display:inline-block;background:linear-gradient(135deg,#1e3a8a,#312e81);border:1px solid #3b4fd8;border-radius:999px;padding:5px 14px;font-size:11px;font-weight:600;letter-spacing:.08em;color:#a5b4fc;text-transform:uppercase;margin-bottom:8px}
  .header-inline h1{font-size:clamp(18px,4vw,26px);font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
</style>
</head>
<body>

<div id="screen-quiz">
  <div class="header-inline">
    <div class="badge">Community Pharmacy · Exam Practice</div>
    <h1>Three-Phase MCQ Quiz</h1>
    <div id="phase-controls" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px"><button class="btn primary" onclick="selectPhase('all')">All Phases</button><button class="btn secondary" onclick="selectPhase('السنوات السابقة')">السنوات السابقة</button><button class="btn secondary" onclick="selectPhase('ملف خليل lecture 2')">ملف خليل lecture 2</button><button class="btn secondary" onclick="selectPhase('ملف خليل lecture 5')">ملف خليل lecture 5</button></div>
  </div>
  <div class="quiz-topbar">
    <div class="pills">
      <div class="pill">Score: <span id="score-display">0/0</span></div>
      <div class="pill">Q <span id="progress-display">1/1</span></div>
    </div>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-bar" style="width:0%"></div></div>
  <div class="quiz-card">
    <div class="qhead"><span class="qtag" id="q-tag">Lec.5</span><span class="qmode" id="q-mode">Normal order</span></div>
    <div class="question-text" id="q-text">Loading…</div>
    <div class="options" id="q-options"></div>
    <div class="explain" id="q-explain"></div>
    <div class="controls">
      <button class="btn secondary" id="btn-prev" onclick="prevQ()">← Back</button>
      <button class="btn primary" id="btn-next" onclick="nextQ()">Next →</button>
      <button class="btn purple" onclick="shuffleQ()">🔀 Shuffle</button>
      <button class="btn success" onclick="restartQ()">↺ Restart</button>
      <button class="btn ghost" id="btn-sheet" onclick="toggleSheet()">Show Answer Sheet</button>
    </div>
    <div class="answer-list" id="answer-list"><h3>Answer Sheet</h3><div class="answer-grid" id="answer-grid"></div></div>
    <div class="footer-tip">Tip: keep shuffling until every answer feels instant 🎯</div>
  </div>
</div>

<div id="screen-results">
  <div class="result-card">
    <div class="result-emoji" id="r-emoji">🎉</div>
    <div class="result-score" id="r-score">0/0</div>
    <div class="result-label">Final Score</div>
    <div class="result-msg" id="r-msg">Well done!</div>
    <div class="result-actions">
      <button class="btn primary" onclick="restartQ()">↺ Try Again</button>
      <button class="btn purple" onclick="shuffleAndRestart()">🔀 Shuffle & Retry</button>
    </div>
  </div>
</div>

<script>
const BANK = [{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Responsible for causing severe diarrhea in infants and children under the age of 2 years","opts":["A) Adenovirus","B) Norovirus","C) Rotavirus","D) *E. coli*","E) *Salmonella*"],"ans":"C) Rotavirus","note":"Why C is correct: Rotavirus is the leading cause of severe acute gastroenteritis and diarrhea in infants and children under 2 years old, peaking in winter. Why others are wrong: Norovirus affects all ages; Adenovirus is a less common viral cause; E. coli and Salmonella are bacterial food-borne pathogens rather than the primary cause in infants under 2."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Adsorbents such as kaolin are not recommended for acute diarrheas because of interaction with","opts":["A) Activated charcoal","B) Pektokaolin","C) Omeprazole","D) Zinc supplements","E) Oral rehydration salts"],"ans":"E) Oral rehydration salts","note":"Why E is correct: Adsorbents like kaolin can bind to and interfere with the absorption of essential Oral Rehydration Salts (ORS) and other oral medications in the GI tract, offering no fluid-replacement benefit. Why others are wrong: Pektokaolin is the brand formulation containing kaolin itself; activated charcoal is another adsorbent; omeprazole and zinc are not the primary therapeutic cornerstone compromised in acute rehydration."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Persistent diarrhea is defined as duration","opts":["A) More than 24 hours","B) More than 7 days","C) More than 4 weeks","D) More than 2 months","E) More than 6 months"],"ans":"B) More than 7 days","note":"Why B is correct: Among the available choices, > 7 days represents the transition beyond brief acute self-limiting episodes toward persistent duration before reaching the 4-week chronic threshold. Why others are wrong: > 24 hours is still acute diarrhea (< 14 days); > 4 weeks, > 2 months, and > 6 months fall under chronic diarrhea."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Considered OTC only in patients > 12 years old","opts":["A) Diphenhydramine","B) Loperamide","C) Bisacodyl","D) Metoclopramide","E) Omeprazole"],"ans":"B) Loperamide","note":"Why B is correct: Loperamide is licensed as an OTC antimotility agent specifically for patients older than 12 years (whereas co-phenotrope is > 16 years). Why others are wrong: Omeprazole OTC is restricted to adults $\\ge 18$ years; metoclopramide is prescription-only (POM); diphenhydramine and bisacodyl are not OTC antidiarrheals restricted to > 12 years."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Causes of chronic diarrhea","opts":["A) IBS","B) Crohn's disease","C) Celiac disease","D) All of them","E) None of them"],"ans":"D) All of them","note":"Why D is correct: Lecture slide 11 explicitly lists Irritable Bowel Syndrome (IBS), Inflammatory Bowel Disease (Crohn's disease, ulcerative colitis), and malabsorption syndromes (celiac disease) as causes of chronic diarrhea. Why others are wrong: A, B, and C are each individually correct, making D the only complete answer."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Precipitating or aggravating factors of reflux disease EXCEPT","opts":["A) Bending or lying down","B) Overweight","C) Exercise","D) Stress","E) Fatty meals"],"ans":"C) Exercise","note":"Why C is correct: Moderate regular exercise is generally encouraged for weight management and is not listed among standard GERD precipitants. Why others are wrong: Bending/lying down reduces gravitational clearance; overweight increases intra-abdominal pressure; stress and large/fatty meals reduce lower esophageal sphincter (LES) tone and delay gastric emptying."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Containing antacids can form a 'raft' that floats on gastric contents to reduce reflux","opts":["A) Aluminum hydroxide","B) Magnesium trisilicate","C) Alginate","D) Calcium carbonate","E) Sodium bicarbonate"],"ans":"C) Alginate","note":"Why C is correct: Alginates (e.g., Gaviscon®) react with gastric acid and bicarbonate to form a neutral-pH viscous foam raft that floats on top of stomach contents, physically blocking upward acid reflux. Why others are wrong: Aluminum hydroxide, magnesium trisilicate, calcium carbonate, and sodium bicarbonate are simple acid-neutralizing antacids that do not form a floating physical barrier on their own."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"PPIs supplied OTC for relief of heartburn associated with reflux in adults > 18 years","opts":["A) Esomeprazole","B) Omeprazole","C) Pantoprazole","D) All of them","E) None of them"],"ans":"D) All of them","note":"Why D is correct: Lecture slide 28 states that esomeprazole, omeprazole, and pantoprazole are all available OTC for frequent heartburn in adults aged 18 and over. Why others are wrong: A, B, and C are all valid OTC PPIs, so selecting only one is incomplete."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"When acidic gastric contents reflux into the esophagus causing irritation","opts":["A) Peptic ulcer disease","B) Heartburn","C) Gastritis","D) Flatulence","E) Dysphagia"],"ans":"B) Heartburn","note":"Why B is correct: Heartburn (GERD) is defined as the reflux of acidic gastric contents into the unprotected esophageal mucosa, causing a retrosternal burning sensation. Why others are wrong: Peptic ulcer disease and gastritis involve mucosal injury in the stomach/duodenum; flatulence is intestinal gas; dysphagia is difficulty swallowing."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Hemorrhoids are swollen blood vessels that project into the bowel lumen during?","opts":["A) Urination","B) Defecation","C) Sneezing","D) Walking","E) Sleeping"],"ans":"B) Defecation","note":"Why B is correct: Lecture slide 34 defines hemorrhoids as conglomerations of inflamed, swollen blood vessels and tissue that project into the bowel lumen during defecation (especially with straining). Why others are wrong: Urination, sneezing, walking, and sleeping are not the defining physiological events causing internal hemorrhoidal projection into the bowel lumen."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Hemorrhoids graded according to severity - incorrect statement","opts":["A) Grade I: do not prolapse","B) Grade II: prolapse but reduce spontaneously","C) Grade III: require manual reduction","D) Grade IV: can be reduced manually","E) All are correct"],"ans":"D) Grade IV: can be reduced manually","note":"Why D is correct (the false statement): Grade IV internal hemorrhoids remain permanently prolapsed and cannot be reduced manually (carrying a risk of thrombosis and gangrene). Why others are wrong: Grades I, II, and III are accurately defined according to standard staging."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Causes of hemorrhoids - all TRUE except","opts":["A) Anatomical: degeneration of elastic tissue","B) Physiological: increased anal canal pressure","C) Mechanical: straining at defecation","D) None of them","E) All of them"],"ans":"D) None of them","note":"Why D is correct: All three mechanisms (anatomical degeneration, physiological high anal pressure, and mechanical straining) are true contributing causes of hemorrhoids, so there is no false statement among A–C. Why others are wrong: A, B, and C are all true statements from lecture slide 35."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Mr. FT has come into your pharmacy with previously diagnosed hemorrhoids. Which one of the following symptoms would indicate referral to the doctor?","opts":["A) Bright red blood on the surface of the stool.","B) Stools that are tarry.","C) Perianal itching.","D) Mucous discharge.","E) Dull ache on defecation."],"ans":"B) Stools that are tarry.","note":"Why B is correct: Dark, tarry stools (melena) indicate bleeding higher up in the gastrointestinal tract (stomach or small intestine) rather than uncomplicated hemorrhoids and require immediate medical investigation. Why others are wrong: Bright red blood on the stool surface (in previously diagnosed piles), mild perianal itching, minor mucous discharge, and a dull ache during defecation are typical local symptoms of uncomplicated hemorrhoids."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"A.M., a 14-year-old male, complains of heartburn, which tends to get worse when lying down. Which drug is most suitable for treating?","opts":["A) Ranitidine.","B) Gaviscon Liquid.","C) Esomeprazole.","D) Milk of Magnesia.","E) Sodium bicarbonate powder."],"ans":"B) Gaviscon Liquid.","note":"Why B is correct: Gaviscon® (alginate) forms a floating raft that physically prevents reflux when lying down, works rapidly, and has no age restriction preventing use in a 14-year-old (also note: children with heartburn generally warrant careful assessment/referral, making a safe physical barrier best for immediate symptomatic relief). Why others are wrong: Ranitidine was withdrawn from the market due to NDMA contamination and OTC H2RAs are restricted to > 16 years; OTC esomeprazole is restricted to adults $\\ge 18$ years; Milk of Magnesia (magnesium hydroxide) causes osmotic diarrhea and lacks a raft barrier; sodium bicarbonate has a very short duration, causes acid rebound/gas, and carries a high sodium load."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Used for many years to treat breast tenderness associated with PMS","opts":["A) Cranberry extract","B) Evening primrose oil","C) Lavender extract","D) Black seed oil","E) Iron supplements"],"ans":"B) Evening primrose oil","note":"Why B is correct: Lecture slide 37 notes that evening primrose oil has traditionally been used for many years to relieve cyclical breast tenderness (mastalgia) in PMS, though strong clinical evidence is limited. Why others are wrong: Cranberry is associated with UTIs; lavender, black seed oil, and iron are not established traditional remedies for PMS breast tenderness."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Oral fluconazole interacts with certain drugs, such as","opts":["A) Amoxicillin","B) Paracetamol","C) Phenytoin","D) Ibuprofen","E) Omeprazole"],"ans":"C) Phenytoin","note":"Why C is correct: Fluconazole inhibits cytochrome P450 enzymes and significantly interacts with phenytoin (increasing phenytoin toxicity), as well as warfarin, sulfonylureas, ciclosporin, rifampicin, and theophylline. Why others are wrong: Amoxicillin, paracetamol, ibuprofen, and omeprazole do not have clinically significant CYP-mediated interactions with a single 150 mg dose of fluconazole."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Treatment previously tried before seeking advice but failed $\\rightarrow$ referral needed EXCEPT *(Medications predisposing to vaginal thrush requiring prescriber contact)*","opts":["A) Broad-spectrum antibiotics","B) Corticosteroids","C) Cancer chemotherapy","D) All require referral","E) None of them"],"ans":"D) All require referral","note":"Why D is correct: Broad-spectrum antibiotics, systemic corticosteroids, and cancer chemotherapy all disrupt normal vaginal flora or immunity, predisposing patients to recurrent/complicated candidiasis that requires physician involvement. Why others are wrong: None of A, B, or C can be safely ignored without medical/prescriber consultation."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Recommended as a folk remedy for urinary tract infection prevention","opts":["A) Orange juice","B) Cranberry juice","C) Apple vinegar","D) Mint tea","E) Ginger tea"],"ans":"B) Cranberry juice","note":"Why B is correct: Lecture slide 15 specifically identifies cranberry juice as a popular folk remedy recommended for UTI prevention (though recent studies show limited clinical benefit in acute cystitis). Why others are wrong: Orange juice, apple vinegar, mint tea, and ginger tea are not cited as standard folk remedies for UTI prevention."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Regarding dysmenorrhea, all the following statements are right EXCEPT:","opts":["A) Nonpharmacological simple measure like the use of hot-water bottle.","B) Transcutaneous electrical nerve stimulation (TENS) machines can be purchased OTC and have been used for painful periods.","C) NSAIDs also inhibit prostaglandin production, decreasing uterine contractions.","D) Ibuprofen tablets on need, for 2–3 days each period, rather than ‘now and then’ when pain builds up.","E) Take the first dose of Ibuprofen as soon as the pain begins or as soon as the bleeding starts, whichever comes first."],"ans":"D) Ibuprofen tablets on need, for 2–3 days each period, rather than ‘now and then’ when pain builds up.","note":"Why D is correct (the false statement): Lecture slide 31 explicitly advises taking NSAIDs regularly (scheduled dosing) for the first 2–3 days of the period to continuously suppress prostaglandin synthesis, rather than taking them \"on need\" (PRN). Why others are wrong: Local heat (A), OTC TENS units (B), prostaglandin inhibition by NSAIDs (C), and taking the first dose at the earliest onset of pain or bleeding (E) are all accurate statements."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"All the following statements are right regarding Premenstrual syndrome (PMS), EXCEPT?","opts":["A) The PMS describes a collection of symptoms, both physical and psychological.","B) Symptoms are experienced cyclically, usually from 2 to 14 days before menstruation.","C) Relief from symptoms generally occurs once menstrual bleeding end.","D) The cause of PMS is unknown, but it is associated with ovulation.","E) None of the above."],"ans":"C) Relief from symptoms generally occurs once menstrual bleeding end.","note":"Why C is correct (the false statement): Lecture slide 33 states that relief from PMS symptoms generally occurs once menstrual bleeding begins (not when it ends). Why others are wrong: A, B, and D are exact definitions and epidemiological facts from slides 33–34."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Which medicine is the drug of choice for nasal congestion caused by allergic rhinitis?","opts":["A) Acrivastine.","B) Chlorphenamine.","C) Loratadine.","D) Nasal Beclometasone.","E) Nasal decongestant."],"ans":"D) Nasal Beclometasone.","note":"Why D is correct: Intranasal corticosteroid sprays (e.g., beclometasone, fluticasone) are the treatment of choice for moderate-to-severe allergic rhinitis and are superior to oral antihistamines, effectively relieving nasal congestion as well as sneezing and rhinorrhea. Why others are wrong: Oral antihistamines (acrivastine, chlorphenamine, loratadine) relieve itching, sneezing, and rhinorrhea well but have poor efficacy against nasal congestion; topical nasal decongestants only provide temporary relief and risk rebound congestion (rhinitis medicamentosa) if used long-term for allergic rhinitis."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"Which of the following medicines should only be given short-term for the relief of hay fever?","opts":["A) Acrivastine.","B) Beclometasone.","C) Sodium cromoglicate.","D) Naphazoline.","E) Fluticasone."],"ans":"D) Naphazoline.","note":"Why D is correct: Naphazoline is a topical sympathomimetic decongestant; its use must be restricted to short-term therapy (typically $\\le 5\\text{--}7$ days) to prevent rebound nasal congestion (rhinitis medicamentosa). Why others are wrong: Beclometasone and fluticasone (intranasal steroids) and sodium cromoglicate (mast cell stabilizer) are used continuously throughout the hay fever season; acrivastine is an oral antihistamine that does not cause rebound congestion."},{"phase":"السنوات السابقة","source":"السنوات السابقة","q":"The recommended duration of treatment of earwax impaction by Docusate (Dewax®) ear drop is?","opts":["A) Two consecutive nights","B) Three consecutive nights.","C) Four consecutive days.","D) Five consecutive hours.","E) None of the above."],"ans":"A) Two consecutive nights","note":"Why A is correct: Lecture slide 12 explicitly states for Docusate (Dewax®): \"fill the affected ear then place a small plug of cotton wool in the ear & repeat not more than two consecutive nights.\" Why others are wrong: Three days applies to sodium bicarbonate ear drops (slide 12); four days and five hours are incorrect durations."},{"phase":"ملف خليل lecture 2","source":"ملف خليل lecture 2","q":"A patient with suspected cerumen impaction reports vertigo and tinnitus. Why should this presentation be referred rather than attributed confidently to wax?","opts":["A) These symptoms commonly prove bacterial infection","B) They infrequently occur with wax and may indicate an inner-ear problem","C) They always indicate a foreign body","D) They are expected after every cerumenolytic","E) They indicate seasonal allergy"],"ans":"B) They infrequently occur with wax and may indicate an inner-ear problem","note":""},{"phase":"ملف خليل lecture 2","source":"ملف خليل lecture 2","q":"A 34-year-old patient reports predictable sneezing, nasal itching, watery rhinorrhoea and congestion every spring. Symptoms improve when he remains indoors and worsen on windy days. He has no fever and no sick family members. Which finding most strongly supports the diagnosis of seasonal allergic rhinitis rather than the common cold?","opts":["A) Symptoms lasting several days.","B) Absence of nasal congestion.","C) Presence of coloured nasal discharge from the outset.","D) Symptoms occurring at the same time each year during pollen production.","E) High fever."],"ans":"D) Symptoms occurring at the same time each year during pollen production.","note":""},{"phase":"ملف خليل lecture 2","source":"ملف خليل lecture 2","q":"All of the following seasonal allergic rhinitis not required referral EXCEPT?","opts":["A) Rhinorrhoea.","B) Fever.","C) Clear watery conjunctivitis.","D) Itch.","E) None of the above."],"ans":"B) Fever.","note":""},{"phase":"ملف خليل lecture 2","source":"ملف خليل lecture 2","q":"A contact-lens wearer uses ocular drops for allergic conjunctivitis and develops ocular irritation. Which counselling point best explains the risk?","opts":["A) All ocular drops contain pseudoephedrine.","B) Benzalkonium chloride may be absorbed into soft lenses and released onto the cornea.","C) Cromoglicate permanently stains lenses.","D) Antihistamines dissolve contact lenses.","E) Glycerine causes lens dehydration."],"ans":"B) Benzalkonium chloride may be absorbed into soft lenses and released onto the cornea.","note":""},{"phase":"ملف خليل lecture 2","source":"ملف خليل lecture 2","q":"Which children with acute otitis media (AOM) may receive initial observation without antibiotics?","opts":["A) Children 6-23 months with non-severe bilateral AOM.","B) All children under 6 months.","C) Children with temperature of 39°C or higher.","D) Children 6-23 months with non-severe unilateral AOM and children 24 months-12 years with non- severe AOM.","E) Children with severe otalgia for 48 hours."],"ans":"D) Children 6-23 months with non-severe unilateral AOM and children 24 months-12 years with non- severe AOM.","note":"with non-severe AOM."},{"phase":"ملف خليل lecture 2","source":"ملف خليل lecture 2","q":"A 20-month-old with acute otitis media (AOM) is considered for a short antibiotic course. Which statement is appropriate?","opts":["A) Short-course therapy is not recommended in children younger than 2 years.","B) Short-course therapy is always preferred under age 2.","C) No analgesia should be offered.","D) Treatment must always be one dose.","E) Tympanostomy is required."],"ans":"A) Short-course therapy is not recommended in children younger than 2 years.","note":""},{"phase":"ملف خليل lecture 2","source":"ملف خليل lecture 2","q":".................... are the treatments of choice for pharyngitis?","opts":["A) Prevent acute rheumatic fever and suppurative complications.","B) Azithromycin and clindamycin.","C) Supportive and steam inhalation.","D) Penicillin and amoxicillin.","E) None of the above."],"ans":"D) Penicillin and amoxicillin.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 35-year-old man presents to the pharmacy with dysuria and urinary frequency for 2 days. He asks for an OTC product. What is the most appropriate action?","opts":["A) Recommend potassium citrate and reassess in 5 days.","B) Recommend cranberry juice capsules.","C) Refer him to the doctor.","D) Advise increased fluid intake only.","E) Recommend sodium bicarbonate for 7 days."],"ans":"C) Refer him to the doctor.","note":"Any man presenting with symptoms of cystitis should be referred, because of the possibility of more serious problems such as renal stones or prostate problems."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"Why is cystitis common in women but rare in men, especially men under the age of 50?","opts":["A) Male urine is more acidic.","B) Men have a longer urethra, and prostatic fluid confers some antibacterial property.","C) Men have higher oestrogen levels.","D) E. coli cannot infect the male bladder.","E) Men drink more fluids than women."],"ans":"B) Men have a longer urethra, and prostatic fluid confers some antibacterial property.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"Which organism is the most common cause of acute uncomplicated cystitis?","opts":["A) Candida albicans.","B) Trichomonas vaginalis.","C) Staphylococcus aureus.","D) Escherichia coli.","E) Proteus mirabilis."],"ans":"D) Escherichia coli.","note":"Bacterial infection causes about 50% of cases; E. coli is the most common organism, usually from the GI tract (the female urethra is only about 3 cm long)."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 28-year-old woman with mild dysuria for one day asks whether cystitis can settle without treatment. What is the lecture-based response?","opts":["A) About half of cases resolve within 3 days even without treatment.","B) Cystitis never resolves without antibiotics.","C) All cases resolve within 24 hours.","D) It always progresses to pyelonephritis.","E) It resolves only if cranberry juice is used."],"ans":"A) About half of cases resolve within 3 days even without treatment.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A mother asks for an OTC product for her 12-year-old daughter, who complains of burning on urination and frequency. What is the most appropriate action?","opts":["A) Recommend potassium citrate diluted with water.","B) Recommend sodium citrate sachets for 2 days.","C) Advise cranberry juice and reassess in a week.","D) Recommend ibuprofen and increased fluids only.","E) Refer, because cystitis is unusual in children and may indicate a structural urinary tract abnormality."],"ans":"E) Refer, because cystitis is unusual in children and may indicate a structural urinary tract abnormality.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 30-year-old woman has dysuria and frequency for 2 days. She also reports fever, nausea, vomiting and loin pain. What is the most appropriate action?","opts":["A) Recommend potassium citrate.","B) Recommend paracetamol for up to 2 days.","C) Advise her to drink about 5 litres of fluid daily.","D) Refer, as these symptoms may indicate an upper urinary tract infection.","E) Recommend sodium bicarbonate and reassess in 3 days."],"ans":"D) Refer, as these symptoms may indicate an upper urinary tract infection.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 33-year-old woman has had dysuria and urinary frequency for one day. She has also noticed blood in her urine. What is the most appropriate action?","opts":["A) Recommend potassium citrate and reassess in 2 days.","B) Recommend sodium citrate sachets.","C) Advise cranberry juice and increased fluids.","D) Refer her, because haematuria (blood in the urine) requires referral.","E) Recommend ibuprofen for up to 2 days."],"ans":"D) Refer her, because haematuria (blood in the urine) requires referral.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"Which of the following is described as a classical symptom of cystitis?","opts":["A) Passing large volumes of urine.","B) Dysuria (pain on urination).","C) Loin pain.","D) High fever.","E) Vaginal discharge."],"ans":"B) Dysuria (pain on urination).","note":"Dysuria is the classical symptom of cystitis; loin pain, fever and vaginal discharge are referral signs."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A woman who is 24 weeks pregnant presents with symptoms of cystitis. Why should she be referred?","opts":["A) Potassium citrate is teratogenic.","B) Cystitis does not occur during pregnancy.","C) Bacteriuria in pregnancy can lead to kidney infection and other problems.","D) Cranberry juice is contraindicated in pregnancy.","E) She needs a higher dose of an alkalinizing agent."],"ans":"C) Bacteriuria in pregnancy can lead to kidney infection and other problems.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"OTC treatment of cystitis is considered reasonable when:","opts":["A) Symptoms are mild, of short duration (< 3 days), and no other symptoms are present.","B) Symptoms have lasted 5–7 days.","C) Symptoms have lasted more than 7 days.","D) The patient has recurrent cystitis.","E) The patient is a man under 50 years."],"ans":"A) Symptoms are mild, of short duration (< 3 days), and no other symptoms are present.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 40-year-old woman has had symptoms of cystitis for 8 days and asks for an OTC product. Why should she be referred?","opts":["A) Symptoms lasting longer than 5–7 days may indicate pyelonephritis.","B) Cystitis lasting this long is always viral.","C) She most likely has vaginal thrush.","D) Alkalinizing agents are licensed for one day only.","E) She needs a higher intake of cranberry juice."],"ans":"A) Symptoms lasting longer than 5–7 days may indicate pyelonephritis.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 26-year-old woman gets frequent episodes of cystitis following sexual intercourse (honeymoon cystitis). Which statement is correct?","opts":["A) It is caused by a fungal infection.","B) Her doctor may prescribe trimethoprim (POM) to be taken within 2 hours of sex.","C) She should take potassium citrate before every intercourse.","D) Honeymoon cystitis occurs only in men.","E) Cranberry juice is the treatment of choice."],"ans":"B) Her doctor may prescribe trimethoprim (POM) to be taken within 2 hours of sex.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 48-year-old patient receiving chemotherapy develops urinary symptoms. Which cytotoxic drug is known to cause cystitis?","opts":["A) Paracetamol.","B) Fluconazole.","C) Cyclophosphamide.","D) Ibuprofen.","E) Potassium citrate."],"ans":"C) Cyclophosphamide.","note":"Cyclophosphamide causes haemorrhagic cystitis via its urinary metabolite acrolein; increased fluid intake and mesna help prevent it. Opioids and nifedipine can also cause urinary symptoms."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 55-year-old woman taking an ACE inhibitor (or spironolactone) asks for potassium citrate for mild cystitis. Key counselling:","opts":["A) It is safe at double the usual dose.","B) It should not be used because it may cause hyperkalaemia.","C) It should be taken undiluted.","D) It can be used for 7 days without referral.","E) It must be taken with cranberry juice."],"ans":"B) It should not be used because it may cause hyperkalaemia.","note":"Potassium citrate must not be used with potassium-sparing diuretics, aldosterone antagonists or ACE inhibitors because it may cause hyperkalaemia."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 45-year-old woman with hypertension asks for an alkalinizing agent for mild cystitis. Which product should NOT be recommended?","opts":["A) Paracetamol.","B) Potassium citrate (if no interacting medicines).","C) Increased fluid intake.","D) Ibuprofen for up to 2 days.","E) Sodium citrate."],"ans":"E) Sodium citrate.","note":"Sodium citrate should not be recommended for hypertensive patients, anyone with heart disease, or pregnant women."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A patient complains that the taste of potassium citrate mixture is unpleasant. Best counselling:","opts":["A) Stop the treatment immediately.","B) Switch to sodium citrate in all patients.","C) Dilute the mixture with water to make the taste more palatable.","D) Take it with cranberry juice.","E) Take it only once daily."],"ans":"C) Dilute the mixture with water to make the taste more palatable.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"How much fluid should a patient with cystitis be advised to drink?","opts":["A) Fluids should be restricted.","B) About 1 litre per day.","C) About 10 litres per day.","D) About 5 litres per day, to promote urination and 'flush' bacteria from the bladder.","E) Fluids only at night."],"ans":"D) About 5 litres per day, to promote urination and 'flush' bacteria from the bladder.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"If the symptoms of cystitis have not improved within ………………… of beginning treatment, the patient should see the doctor.","opts":["A) 12 hours","B) 2 days","C) 5 days","D) 7 days","E) 2 weeks"],"ans":"B) 2 days","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"All of the following patients with symptoms of cystitis should be referred EXCEPT:","opts":["A) A woman with diabetes.","B) A 75-year-old woman.","C) A 32-year-old non-pregnant woman with mild dysuria for 1 day and no other symptoms.","D) A woman with haematuria.","E) A woman with vaginal discharge."],"ans":"C) A 32-year-old non-pregnant woman with mild dysuria for 1 day and no other symptoms.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"Primary dysmenorrhoea (PD) is defined as:","opts":["A) Menstrual pain without organic pathology.","B) Menstrual pain caused by endometriosis.","C) Pain that starts one week before menses.","D) Menstrual pain associated with heavy bleeding.","E) Pain occurring after the menopause."],"ans":"A) Menstrual pain without organic pathology.","note":"PD is menstrual pain without organic pathology; in secondary dysmenorrhoea an identifiable pathological condition is present (refer)."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 17-year-old girl reports lower abdominal cramping pain that starts a few hours before her period and is usually gone by the end of the first day of bleeding. What is the most likely diagnosis?","opts":["A) Secondary dysmenorrhoea.","B) Premenstrual syndrome.","C) Primary dysmenorrhoea.","D) Cystitis.","E) Vaginal thrush."],"ans":"C) Primary dysmenorrhoea.","note":"PD pain starts very shortly before or within 24 h of the onset of menses, eases gradually, and is often gone by the end of the first day of bleeding."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 36-year-old woman reports new period pain that starts about 5 days before menses and persists after menstruation finishes. What is the most appropriate action?","opts":["A) Recommend ibuprofen and reassess after two cycles.","B) Recommend hyoscine butylbromide.","C) Advise a heat pad only.","D) Refer her to the doctor, as the presentation suggests secondary dysmenorrhoea.","E) Recommend aspirin 1000 mg every 4 hours."],"ans":"D) Refer her to the doctor, as the presentation suggests secondary dysmenorrhoea.","note":"Pain starting days before menses and persisting afterwards suggests secondary dysmenorrhoea; women over 30 with new or worsening symptoms should also be referred."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"Why is dysmenorrhoea often NOT associated with the start of menstruation (menarche)?","opts":["A) Prostaglandins are absent before the age of 16.","B) Ovulation often does not occur during the early months of menstruation (anovulatory cycles).","C) Oestrogen is absent at menarche.","D) Periods are shorter at menarche.","E) The uterus is too small to contract."],"ans":"B) Ovulation often does not occur during the early months of menstruation (anovulatory cycles).","note":"During the early months (sometimes years) of menstruation ovulation does not occur, and anovulatory cycles are usually pain-free."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"The initial onset of primary dysmenorrhoea is usually:","opts":["A) 6–12 months after menarche, with the onset of ovulatory cycles.","B) At the first menstrual period.","C) In the 30s or 40s.","D) After the first pregnancy.","E) After the menopause."],"ans":"A) 6–12 months after menarche, with the onset of ovulatory cycles.","note":"PD usually starts 6–12 months after menarche, with the onset of ovulatory cycles (menarche occurs between 10 and 16 years)."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 22-year-old woman had pain-free periods for the first two years after menarche, but now experiences period pain. She asks whether this is abnormal. What is the lecture-based explanation?","opts":["A) Pain starting after menarche always indicates secondary dysmenorrhoea.","B) Dysmenorrhoea always begins with the first period.","C) Her pain is caused by a urinary tract infection.","D) Her pain indicates the onset of the menopause.","E) Early menstrual cycles are often anovulatory and usually pain-free, so period pain may begin months or years after menarche."],"ans":"E) Early menstrual cycles are often anovulatory and usually pain-free, so period pain may begin months or years after menarche.","note":"menarche."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"Which statement about the menstrual cycle is correct?","opts":["A) A normal cycle is exactly 28 days in all women.","B) A normal period lasts 7–10 days.","C) A normal cycle is 10–16 days.","D) A period lasting 5 days is abnormal.","E) A normal cycle is 21–35 days, and a period normally lasts 2–7 days (average 5 days)."],"ans":"E) A normal cycle is 21–35 days, and a period normally lasts 2–7 days (average 5 days).","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"In primary dysmenorrhoea, the pain typically lasts:","opts":["A) Between 8 and 72 hours, and improves as the menses progresses.","B) Throughout the whole menstrual cycle.","C) 1–2 weeks before menses.","D) Less than one hour.","E) 7–10 days after menstruation finishes."],"ans":"A) Between 8 and 72 hours, and improves as the menses progresses.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 24-year-old woman with period pain is taking a combined oral contraceptive pill (COC). What is the most appropriate action?","opts":["A) Recommend naproxen and reassess after two cycles.","B) Refer her, since COCs usually reduce or eliminate dysmenorrhoea and further investigation is needed.","C) Advise her to stop the pill.","D) Recommend hyoscine butylbromide.","E) Recommend aspirin 650 mg."],"ans":"B) Refer her, since COCs usually reduce or eliminate dysmenorrhoea and further investigation is needed.","note":"COCs or desogestrel usually reduce or eliminate dysmenorrhoea, so a woman with symptoms while taking the pill is best referred for further investigation."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"What is considered the first-line OTC treatment option for primary dysmenorrhoea, provided it is appropriate for the patient?","opts":["A) Paracetamol.","B) Aspirin.","C) Hyoscine butylbromide.","D) NSAIDs such as ibuprofen and naproxen.","E) Evening primrose oil."],"ans":"D) NSAIDs such as ibuprofen and naproxen.","note":"NSAIDs are first-line because, in addition to analgesia, they inhibit prostaglandin production and decrease uterine contractions."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 20-year-old woman with dysmenorrhoea also experiences nausea and vomiting with her periods. Which analgesic is best avoided?","opts":["A) Paracetamol.","B) Aspirin.","C) A heat pad.","D) TENS.","E) A warm bath."],"ans":"B) Aspirin.","note":"Aspirin is less effective than ibuprofen and more irritant to the stomach, so it is best avoided in women with nausea and vomiting."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"Why is paracetamol theoretically less effective than NSAIDs for dysmenorrhoea?","opts":["A) It is more irritant to the stomach.","B) It is poorly absorbed orally.","C) It does not inhibit prostaglandin synthesis.","D) It has anticholinergic side effects.","E) It increases uterine contractions."],"ans":"C) It does not inhibit prostaglandin synthesis.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"The dose of aspirin for dysmenorrhoea is:","opts":["A) 75 mg once daily.","B) 300 mg as a single dose.","C) 2 g every 2 hours.","D) 650–1000 mg every 4–6 hours (maximum 4 g/day).","E) 100 mg every 12 hours."],"ans":"D) 650–1000 mg every 4–6 hours (maximum 4 g/day).","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A woman with narrow-angle glaucoma asks for hyoscine butylbromide (Buscopan® 10 mg) for period cramps. Key counselling:","opts":["A) It is contraindicated in narrow-angle glaucoma.","B) It is safe at two tablets four times daily.","C) It should be taken together with an antihistamine.","D) Only constipation needs to be considered.","E) It should be taken only at night."],"ans":"A) It is contraindicated in narrow-angle glaucoma.","note":"Buscopan 10 mg: two tablets four times daily; anticholinergic side effects (dry mouth, visual disturbance, constipation); contraindicated in narrow-angle glaucoma; side effects potentiated by TCAs and antihistamines."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A patient asks how to take ibuprofen for primary dysmenorrhoea. Which practical point is correct?","opts":["A) Take it only 'now and then' when the pain builds up.","B) Take the first dose as soon as the pain begins or the bleeding starts, whichever comes first, then regularly for 2–3 days.","C) Start taking it 2 weeks before the period.","D) Take a single dose once a month.","E) Stop it as soon as bleeding starts."],"ans":"B) Take the first dose as soon as the pain begins or the bleeding starts, whichever comes first, then regularly for 2–3 days.","note":"days."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A woman reports that the maximum non-prescription dose of ibuprofen did not give adequate relief of her period pain. What is the lecture-based response?","opts":["A) Double the ibuprofen dose.","B) Stop all analgesics.","C) Add aspirin to ibuprofen.","D) Use cranberry capsules.","E) Switch to another NSAID, as patients may respond better to one NSAID than another."],"ans":"E) Switch to another NSAID, as patients may respond better to one NSAID than another.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"If the pain of primary dysmenorrhoea is not improved after ………………… of treatment, referral to the doctor is advisable.","opts":["A) 2 days","B) 1 week","C) two cycles","D) 6 months","E) 1 year"],"ans":"C) two cycles","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"All of the following are non-pharmacological measures for primary dysmenorrhoea EXCEPT:","opts":["A) A heat pad or hot water bottle on the abdomen.","B) Warm baths or showers.","C) Transcutaneous electrical nerve stimulation (TENS).","D) Exercise.","E) Vaginal douching."],"ans":"E) Vaginal douching.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"All of the following women with dysmenorrhoea should be referred EXCEPT:","opts":["A) A 19-year-old with cramping pain starting on the first day of bleeding and settling within a day.","B) Heavy or unexplained bleeding.","C) Accompanying fever and malaise.","D) Vaginal bleeding in a postmenopausal woman.","E) Presence of abnormal vaginal discharge."],"ans":"A) A 19-year-old with cramping pain starting on the first day of bleeding and settling within a day.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 29-year-old woman reports bloating, breast tenderness and irritability that start about 10 days before her period and resolve once bleeding begins. What is the most likely diagnosis?","opts":["A) Primary dysmenorrhoea.","B) Secondary dysmenorrhoea.","C) Premenstrual syndrome.","D) Cystitis.","E) Vaginal thrush."],"ans":"C) Premenstrual syndrome.","note":"PMS symptoms (physical and mental) occur cyclically 2–14 days before menstruation and are relieved once bleeding begins."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"PMS does not occur before puberty, during pregnancy, after the menopause, or in women who do not ovulate. This indicates that PMS is associated with:","opts":["A) Ovulation.","B) Menstrual bleeding.","C) Candida infection.","D) Oestrogen deficiency.","E) E. coli infection."],"ans":"A) Ovulation.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"One theory states that women with PMS are abnormally sensitive to progesterone secreted after ovulation, which reduces the levels of:","opts":["A) Calcium.","B) Iron.","C) Potassium.","D) Pyridoxine.","E) Vitamin C."],"ans":"D) Pyridoxine.","note":"Reduced pyridoxine, a coenzyme in the final step of serotonin synthesis, may contribute to the depressive symptoms."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A patient asks about taking pyridoxine for PMS. Key counselling:","opts":["A) There is no maximum dose.","B) The dose should be limited to 100 mg daily because of the risk of peripheral neuropathy.","C) The dose should be 1200 mg daily.","D) It causes hyperkalaemia at high doses.","E) It must be taken only during bleeding."],"ans":"B) The dose should be limited to 100 mg daily because of the risk of peripheral neuropathy.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"Which statement about OTC treatment options for PMS is correct?","opts":["A) Calcium is given as 1200 mg elemental calcium daily, and the product must provide the required amount of elemental calcium.","B) Evening primrose oil is proven by good-quality studies to be effective.","C) There is no placebo response in PMS.","D) Calcium supplements have no side effects.","E) Pyridoxine can be given at any dose."],"ans":"A) Calcium is given as 1200 mg elemental calcium daily, and the product must provide the required amount of elemental calcium.","note":"calcium."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"Of the three most common causes of vaginal discharge, which one can be treated OTC?","opts":["A) Bacterial vaginosis.","B) Trichomoniasis.","C) Vulvovaginal candidiasis (thrush).","D) All three conditions.","E) None of the above."],"ans":"C) Vulvovaginal candidiasis (thrush).","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 38-year-old woman complains of vaginal discharge that has a strong odour and is not white or curd-like. What is the most appropriate action?","opts":["A) Recommend fluconazole 150 mg single dose.","B) Recommend a clotrimazole 1-night pessary.","C) Advise vaginal douching.","D) Refer, as bacterial vaginosis or trichomoniasis is more likely.","E) Recommend clotrimazole cream to the vulva."],"ans":"D) Refer, as bacterial vaginosis or trichomoniasis is more likely.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"Which finding is the most important to differentiate vaginal thrush from bacterial vaginosis and trichomoniasis?","opts":["A) Absence of an offensive odour of the vaginal discharge.","B) Presence of dysuria.","C) Presence of fever.","D) Volume of the discharge.","E) Duration of the menstrual cycle."],"ans":"A) Absence of an offensive odour of the vaginal discharge.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A profuse, frothy, greenish-yellow vaginal discharge is most likely associated with:","opts":["A) Vaginal thrush.","B) Trichomoniasis.","C) Bacterial vaginosis.","D) Cystitis.","E) Primary dysmenorrhoea."],"ans":"B) Trichomoniasis.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 25-year-old woman presents with vulvar itching, burning and a white curd-like discharge. She has never had these symptoms before. What is the most appropriate action?","opts":["A) Recommend fluconazole 150 mg single dose.","B) Recommend a clotrimazole 1-night pessary.","C) Recommend a vaginal deodorant.","D) Advise douching after each wash.","E) Refer, because this is the first occurrence of symptoms."],"ans":"E) Refer, because this is the first occurrence of symptoms.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"Why should women under 16 or over 60 years with symptoms of vaginal thrush be referred?","opts":["A) High oestrogen at these ages strongly promotes Candida.","B) Lack of oestrogen removes the protective barrier, increasing the tendency to bacterial (but not fungal) infection.","C) Fluconazole is ineffective at these ages.","D) The symptoms are always due to an STD.","E) Candida cannot grow in the vagina at any age."],"ans":"B) Lack of oestrogen removes the protective barrier, increasing the tendency to bacterial (but not fungal) infection.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 30-year-old woman reports her third episode of vaginal thrush within the previous 6 months. What is the most appropriate action?","opts":["A) Recommend fluconazole and reassess in 7 days.","B) Recommend a clotrimazole 7-night regimen.","C) Refer, as recurrent attacks may indicate an underlying cause such as diabetes.","D) Treat her husband only.","E) Advise a perfumed soap."],"ans":"C) Refer, as recurrent attacks may indicate an underlying cause such as diabetes.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A woman with typical vaginal thrush symptoms is taking warfarin and asks for oral fluconazole. Key counselling:","opts":["A) Oral fluconazole interacts with anticoagulants, so a topical imidazole is a more suitable option.","B) Fluconazole is safe with all medicines.","C) She should take a double dose of fluconazole.","D) Fluconazole must be taken only at night.","E) Fluconazole is contraindicated only in men."],"ans":"A) Oral fluconazole interacts with anticoagulants, so a topical imidazole is a more suitable option.","note":"Oral fluconazole interacts with anticoagulants, oral sulphonylureas, ciclosporin, phenytoin, rifampicin and theophylline."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"Which statement about OTC oral fluconazole for vaginal thrush is correct?","opts":["A) It is given as 50 mg daily for 7 days.","B) It must be taken at night only.","C) It is the preferred option during pregnancy and breastfeeding.","D) It is given as a single 150 mg dose at any time of the day, and symptoms usually improve within 12–24 hours.","E) GIT side effects occur in all patients."],"ans":"D) It is given as a single 150 mg dose at any time of the day, and symptoms usually improve within 12–24 hours.","note":"Single 150 mg dose at any time of day; symptoms improve within 12–24 h; GI side effects in up to 10%; not recommended in pregnancy or breastfeeding."},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 27-year-old woman who is 20 weeks pregnant presents with typical symptoms of vaginal thrush and asks for fluconazole. What is the most appropriate action?","opts":["A) Recommend fluconazole 150 mg single dose.","B) Refer her; pregnant women may need a longer course, and oral fluconazole is not recommended in pregnancy.","C) Recommend a clotrimazole 1-night pessary with no follow-up.","D) Advise douching until symptoms resolve.","E) Advise waiting 7 days before treatment."],"ans":"B) Refer her; pregnant women may need a longer course, and oral fluconazole is not recommended in pregnancy.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"Why should internal (vaginal) imidazole preparations be administered at night?","opts":["A) The drug is absorbed only in the dark.","B) Night administration prevents interactions with fluconazole.","C) It avoids contact with menstrual blood.","D) Morning administration causes systemic toxicity.","E) This gives the drug time to be absorbed and reduces accidental loss, which is more likely when the patient is mobile."],"ans":"E) This gives the drug time to be absorbed and reduces accidental loss, which is more likely when the patient is mobile.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A woman using a clotrimazole vaginal cream course starts her menstrual period. What is the lecture-based response?","opts":["A) Continue the course; vaginal antifungals can be used during the menstrual period.","B) Stop and restart after the period ends.","C) Switch to oral fluconazole immediately.","D) Double the dose during bleeding.","E) Refer her immediately."],"ans":"A) Continue the course; vaginal antifungals can be used during the menstrual period.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"All of the following can predispose women to vaginal thrush EXCEPT:","opts":["A) Broad-spectrum antibiotics.","B) Corticosteroids.","C) Oral contraceptives or HRT.","D) Wearing cotton underwear.","E) Tamoxifen."],"ans":"D) Wearing cotton underwear.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A 31-year-old woman says she develops vaginal thrush after every course of antibiotics she takes. She has just been prescribed a broad-spectrum antibiotic. What is the lecture-based response?","opts":["A) She should stop the antibiotic immediately.","B) Antibiotics do not predispose to thrush.","C) Her doctor may prescribe an antifungal at the same time as the antibiotic.","D) She should douche daily during the antibiotic course.","E) She should take potassium citrate with the antibiotic."],"ans":"C) Her doctor may prescribe an antifungal at the same time as the antibiotic.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A man has an irritating rash on the penis (candidal balanitis), and his wife has vaginal thrush. What is the appropriate treatment?","opts":["A) No treatment is ever needed for men.","B) Topical azole applied twice daily for 7 days; oral fluconazole can also be used.","C) Potassium citrate mixture.","D) A vaginal pessary.","E) Cranberry capsules."],"ans":"B) Topical azole applied twice daily for 7 days; oral fluconazole can also be used.","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"A patient with vaginal thrush should seek medical advice if symptoms do not improve within ……… or if symptoms persist beyond ………","opts":["A) 1 day; 3 days","B) 7 days; 14 days","C) 12 hours; 24 hours","D) two cycles; three cycles","E) 3 days; 7 days"],"ans":"E) 3 days; 7 days","note":""},{"phase":"ملف خليل lecture 5","source":"ملف خليل lecture 5","q":"Which prevention advice for vaginal thrush is correct?","opts":["A) Use foam baths and vaginal deodorants.","B) Wear synthetic underwear.","C) Keep the area cool and dry, wear cotton underwear, and use an unperfumed, mild cleanser if needed.","D) Douche daily to remove Candida.","E) Keep the area warm and moist."],"ans":"C) Keep the area cool and dry, wear cotton underwear, and use an unperfumed, mild cleanser if needed.","note":""}];

const LETTERS = ['A','B','C','D','E'];

let activeBank = [...BANK];
let order = activeBank.map((_, i) => i);
let idx = 0, score = 0, attempts = 0;
let chosen = new Array(activeBank.length).fill(null);

function shuffleArr(a) {
  for (let j = a.length-1; j > 0; j--) {
    const k = Math.floor(Math.random()*(j+1));
    [a[j],a[k]] = [a[k],a[j]];
  }
  return a;
}

function render() {
  const q = activeBank[order[idx]];
  const answered = chosen[order[idx]] !== null;
  document.getElementById('progress-display').textContent = (idx+1)+'/'+order.length;
  document.getElementById('score-display').textContent = score+'/'+attempts;
  document.getElementById('progress-bar').style.width = ((idx+1)/order.length*100).toFixed(1)+'%';
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').textContent = idx === order.length-1 ? 'Finish ✓' : 'Next →';
  document.getElementById('q-tag').textContent = q.phase;
  document.getElementById('q-text').textContent = (idx+1)+'. '+q.q;
  const optDiv = document.getElementById('q-options');
  optDiv.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="opt-letter">'+LETTERS[i]+'</span><span>'+opt.replace(/^[A-Ea-e][\)\.\-]\s*/,'')+'</span>';
    btn.onclick = () => choose(opt);
    if (answered) {
      btn.disabled = true;
      if (opt === q.ans) btn.classList.add('correct');
      if (opt === chosen[order[idx]] && opt !== q.ans) btn.classList.add('wrong');
    }
    optDiv.appendChild(btn);
  });
  const ex = document.getElementById('q-explain');
  if (answered) {
    ex.className = 'explain show';
    const isOk = chosen[order[idx]] === q.ans;
    ex.innerHTML = '<span class="correct-label">'+(isOk?'✅ Correct!':'❌ Incorrect')+' — Answer: '+q.ans+'</span>'+(q.note||'');
  } else {
    ex.className = 'explain';
    ex.innerHTML = '';
  }
}

function choose(opt) {
  if (chosen[order[idx]] !== null) return;
  chosen[order[idx]] = opt;
  attempts++;
  if (opt === activeBank[order[idx]].ans) score++;
  render();
}

function nextQ() {
  if (idx < order.length-1) { idx++; render(); }
  else showResults();
}

function prevQ() { if (idx > 0) { idx--; render(); } }


function selectPhase(phase) {
  activeBank = phase === 'all' ? [...BANK] : BANK.filter(q => q.phase === phase);
  order = activeBank.map((_, i) => i); idx=0; score=0; attempts=0;
  chosen = new Array(activeBank.length).fill(null);
  document.getElementById('q-mode').textContent = phase === 'all' ? 'All phases' : phase;
  document.getElementById('answer-list').classList.remove('show');
  document.getElementById('btn-sheet').textContent = 'Show Answer Sheet';
  buildAnswerGrid(); render();
}

function shuffleQ() {
  shuffleArr(order);
  idx=0; score=0; attempts=0;
  chosen = new Array(activeBank.length).fill(null);
  document.getElementById('q-mode').textContent = 'Shuffled 🔀';
  document.getElementById('answer-list').classList.remove('show');
  document.getElementById('btn-sheet').textContent = 'Show Answer Sheet';
  render();
}

function restartQ() {
  order = activeBank.map((_, i) => i);
  idx=0; score=0; attempts=0;
  chosen = new Array(activeBank.length).fill(null);
  document.getElementById('screen-results').style.display = 'none';
  document.getElementById('screen-quiz').style.display = 'block';
  document.getElementById('q-mode').textContent = 'Normal order';
  document.getElementById('answer-list').classList.remove('show');
  document.getElementById('btn-sheet').textContent = 'Show Answer Sheet';
  render();
}

function shuffleAndRestart() {
  shuffleArr(order = activeBank.map((_, i) => i));
  idx=0; score=0; attempts=0;
  chosen = new Array(activeBank.length).fill(null);
  document.getElementById('screen-results').style.display = 'none';
  document.getElementById('screen-quiz').style.display = 'block';
  document.getElementById('q-mode').textContent = 'Shuffled 🔀';
  document.getElementById('answer-list').classList.remove('show');
  document.getElementById('btn-sheet').textContent = 'Show Answer Sheet';
  render();
}

function toggleSheet() {
  const list = document.getElementById('answer-list');
  list.classList.toggle('show');
  document.getElementById('btn-sheet').textContent = list.classList.contains('show') ? 'Hide Answer Sheet' : 'Show Answer Sheet';
}

function buildAnswerGrid() {
  const grid = document.getElementById('answer-grid');
  grid.innerHTML = '';
  activeBank.forEach((q, i) => {
    const d = document.createElement('div');
    d.className = 'answer-mini';
    d.innerHTML = '<div class="q-num">Q'+(i+1)+'</div><div>'+q.q.substring(0,55)+(q.q.length>55?'…':'')+'</div><div class="q-ans">'+q.ans+'</div>';
    grid.appendChild(d);
  });
}

function showResults() {
  const pct = attempts > 0 ? Math.round(score/attempts*100) : 0;
  document.getElementById('screen-quiz').style.display = 'none';
  document.getElementById('screen-results').style.display = 'block';
  document.getElementById('r-score').textContent = score+'/'+attempts;
  let emoji = '🎉';
  let msg = 'Great job!';
  if (pct >= 90) { emoji = '🏆'; msg = 'Outstanding! You nailed it!'; }
  else if (pct >= 75) { emoji = '🎉'; msg = 'Great job! Keep it up!'; }
  else if (pct >= 60) { emoji = '💪'; msg = 'Good effort — review weak spots!'; }
  else if (pct >= 40) { emoji = '📚'; msg = 'Review your notes and try again.'; }
  else { emoji = '🔄'; msg = 'Keep practicing!'; }
  document.getElementById('r-emoji').textContent = emoji;
  document.getElementById('r-msg').textContent = msg + ' (' + pct + '%)';
}

// Auto-start
buildAnswerGrid();
render();
</script>
